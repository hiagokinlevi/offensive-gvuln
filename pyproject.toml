[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "offensive-gvuln"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0", "click>=8.0", "jinja2>=3.1", "tabulate>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.pytest.ini_options]
addopts = "--cov=vuln_management --cov=pentest_governance --cov-report=term-missing --cov-fail-under=70"
